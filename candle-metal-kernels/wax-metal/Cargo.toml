[package]
name = "wax-metal"
version = "0.11.0"
edition = "2024"
description = "Metal backend for wax IR"
repository = "https://github.com/huggingface/candle"
license = "MIT OR Apache-2.0"

[dependencies]
wax-ir = { path = "../../candle-wax/wax-ir" }
thiserror = "2"
half = "2"
sha2 = "0.10"
pliron = "0.20"
pliron-derive = "0.20"
# For all AIR ops that are plain LLVM.
# `default-features = false` drops `llvm-sys`. We use our own emitter.
pliron-llvm = { version = "0.20", default-features = false }
# For verifying our emitted LLVM with stock LLVM. Optional because of `llvm-sys`.
wax-llvm-utils = { path = "../../candle-wax/wax-llvm-utils", optional = true }

[features]
llvm-check = ["dep:wax-llvm-utils"]

[dev-dependencies]
wax-frontend = { path = "../../candle-wax/wax-frontend" }
wax-kernels = { path = "../../candle-wax/wax-kernels" }
syn = { version = "2", features = ["full", "parsing", "extra-traits"] }
