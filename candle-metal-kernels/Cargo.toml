[workspace]
members = ["wax-metal", "wax-llvm-oracle"]
# `wax-llvm-oracle` uses `llvm-sys`which requires system LLVM to build. Keep opt-in.
# Default `cargo test` works without LLVM. `cargo test -p wax-llvm-oracle` requires it.
default-members = [".", "wax-metal"]

[package]
name = "candle-metal-kernels"
version = "0.11.0"
edition = "2021"

description = "Metal kernels for Candle"
repository = "https://github.com/huggingface/candle"
keywords = ["blas", "tensor", "machine-learning"]
categories = ["science"]
license = "MIT OR Apache-2.0"


[features]
default = []
# Emit per-dispatch Metal debug groups for Xcode GPU captures / Instruments.
debug-labels = []
wax = ["dep:wax-metal", "dep:wax-frontend", "dep:wax-ir", "dep:wax-kernels"]

[dependencies]
half = { version = "2.5.0", features = [
    "num-traits",
    "use-intrinsics",
    "rand_distr",
] }
once_cell = "1.21"
thiserror = "2"
tracing = "0.1.41"
objc2-metal = { version = "0.3.2", features = ["block2", "MTLLibrary", "MTLComputePipeline", "MTLAllocation", "dispatch2"] }
dispatch2 = "0.3"
block2 = { version = ">=0.6.1, <0.8.0", features = ["alloc"], default-features = false }
objc2 = "0.6.3"
objc2-foundation = "0.3.2"

wax-metal = { path = "wax-metal", optional = true }
wax-frontend = { path = "../candle-wax/wax-frontend", optional = true }
wax-ir = { path = "../candle-wax/wax-ir", optional = true }
wax-kernels = { path = "../candle-wax/wax-kernels", optional = true }

[dev-dependencies]
clap = { version = "4.5.49", features = ["derive"] }
half = { version = "2.7.1", features = [
    "num-traits",
    "use-intrinsics",
    "rand_distr",
] }
anyhow = "1"
rand = "0.9.2"
rand_distr = "0.5.1"
wax-metal = { path = "wax-metal" }
wax-frontend = { path = "../candle-wax/wax-frontend" }
wax-ir = { path = "../candle-wax/wax-ir" }
syn = { version = "2", features = ["full", "parsing", "extra-traits"] }

[profile.profiling]
inherits = "release"
debug = 2
