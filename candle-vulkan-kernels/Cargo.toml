[package]
name = "candle-vulkan-kernels"
version = "0.11.1"
edition = "2021"
build = "build.rs"

description = "Vulkan compute kernels for Candle"
repository = "https://github.com/huggingface/candle"
keywords = ["blas", "tensor", "machine-learning"]
categories = ["science"]
license = "MIT OR Apache-2.0"

[features]
default = []

[dependencies]
thiserror = "2"
bytemuck = "1"
half = "2.5.0"
vulkano = { git = "https://github.com/amejia1/vulkano.git", rev = "5486164260b78756d01ea26f7f6667f87c66e6fc" }
parking_lot = "0.12"

[build-dependencies]
spirv = "0.3"

[profile.profiling]
inherits = "release"
debug = 2
