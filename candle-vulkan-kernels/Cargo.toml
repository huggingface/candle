[package]
name = "candle-vulkan-kernels"
version = "0.11.1"
edition = "2021"
build = "build.rs"

description = "Vulkan compute kernels for Candle"
repository = "https://github.com/huggingface/candle"
keywords = ["blas", "tensor", "machine-learning"]
categories = ["science"]
license = "MIT OR Apache-2.0"

[features]
default = []

[dependencies]
thiserror = "2"
bytemuck = "1"
half = "2.5.0"
vulkano = { git = "https://github.com/amejia1/vulkano.git", rev = "82fed2cd2af1155e14e3136f1c13be910ade61bf" }
parking_lot = "0.12"

[build-dependencies]
shader-slang-dev = { version = "1", features = ["vendored"] }
spirv = "0.3"

[profile.profiling]
inherits = "release"
debug = 2
