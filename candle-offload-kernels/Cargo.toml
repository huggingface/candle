[package]
name = "candle-offload-kernels"
version = "0.11.0"
edition = "2021"
description = "amdgcn kernels for the candle std::offload backend"
license = "MIT OR Apache-2.0"

# Own workspace: needs `lto = "fat"` for -Zoffload, which shouldn't apply to candle.
[workspace]

# cdylib: offload lowering needs a final artifact (see src/lib.rs).
[lib]
name = "candle_offload_kernels"
path = "src/lib.rs"
crate-type = ["cdylib"]

# No deps: also built for amdgcn as no_std.
[dependencies]

[profile.release]
lto = "fat"
