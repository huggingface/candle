[package]
name = "wax-macro"
version.workspace = true
edition = "2024"
description = "Proc-macros for candle-wax: the #[module] and #[entry] attributes"
repository.workspace = true
keywords.workspace = true
categories.workspace = true
license.workspace = true

[lib]
proc-macro = true

[dependencies]
syn = { workspace = true }
proc-macro2 = { workspace = true }
quote = { workspace = true }
sha2 = "0.10"
cutile-expand = { git = "https://github.com/ivarflakstad/cutile-rs", branch = "main" }
cutile-syn-utils = { git = "https://github.com/ivarflakstad/cutile-rs", branch = "main" }
[dev-dependencies]
cutile-dsl = { git = "https://github.com/ivarflakstad/cutile-rs", branch = "main" }
wax-frontend = { path = "../wax-frontend" }
